# 本機（frontend/nginx.conf）與正式環境（deploy/lightsail/nginx.conf）共用的路由規則，在 server 區塊內 include。
# 需要 http 層級的 $is_platform_host（各 server 設定檔自己定義 map）。
root /usr/share/nginx/html;
index index.html;

# SPA：找不到實體檔案時一律回傳 index.html，交由 React Router 處理路由。
location / {
    try_files $uri $uri/ /index.html;
}

# 健身房首頁＝形象網站（未發布時後端導向 /login）；平台網址的首頁仍是 SPA。
location = / {
    if ($is_platform_host) {
        rewrite ^ /index.html last;
    }
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 形象網站的樣式、預覽、體驗課表單，以及 robots.txt／sitemap.xml
location /site/ {
    proxy_pass http://backend:8000/site/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/(robots\.txt|sitemap\.xml)$ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 反向代理到 docker-compose 中的 backend service，對應 VITE_API_BASE_URL=/api/v1。
location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 上傳檔案（教練照片等）由 backend 以靜態路徑 /media 提供。
location /media/ {
    proxy_pass http://backend:8000/media/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 上傳請求本體：教練照片 2MB、形象網站圖片 5MB，放寬 nginx 預設限制。
client_max_body_size 6m;

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
