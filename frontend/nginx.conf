# 轉給後端的 Host 用 $http_host（含連接埠）：後端產生的絕對網址（分享預覽圖、sitemap）才會正確；判斷子網域時會去掉連接埠
# platform.<主網域> 是平台管理後台（SPA）；其他網址的首頁是該家健身房的形象網站（後端產生，見 docs/adr/0003-gym-website.md）
map $host $is_platform_host {
    ~^platform\.  1;
    default        0;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA：找不到實體檔案時一律回傳 index.html，交由 React Router 處理路由。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健身房首頁＝形象網站（未發布時後端導向 /login）；平台網址的首頁仍是 SPA。
    location = / {
        if ($is_platform_host) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 形象網站的樣式、預覽、體驗課表單，以及 robots.txt／sitemap.xml
    location /site/ {
        proxy_pass http://backend:8000/site/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 反向代理到 docker-compose 中的 backend service，對應 VITE_API_BASE_URL=/api/v1。
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上傳檔案（教練照片等）由 backend 以靜態路徑 /media 提供。
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上傳請求本體：教練照片 2MB、形象網站圖片 5MB，放寬 nginx 預設限制。
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
