# 轉給後端的 Host 用 $http_host（含連接埠）：後端產生的絕對網址（分享預覽圖、sitemap）才會正確；判斷子網域時會去掉連接埠
# platform.<主網域> 是平台管理後台（SPA）；其他網址的首頁是該家健身房的形象網站（後端產生，見 docs/adr/0003-gym-website.md）
map $host $is_platform_host {
    ~^platform\.  1;
    default        0;
}

server {
    listen 80;
    server_name _;

    # 路由規則見 frontend/nginx/routes.conf（與正式環境共用）
    include /etc/nginx/snippets/gym-routes.conf;
}
