<script type="text/babel">
const {StatusTag,SlotPicker,AppLayout}=window.PulseFitDesignSystem_325e30;
function Demo(){

  const preset={'2-10':'booked','4-19':'group','3-12':'closed','5-18':'closed','6-15':'buyout'};
  const cellState=(d,h)=>preset[d+'-'+h]||'empty';

      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <StatusTag status="待確認"/><StatusTag status="已確認"/><StatusTag status="已拒絕"/><StatusTag status="已取消"/>

      <div style={{background:'#fff',border:'1px solid var(--border-secondary)',borderRadius:'var(--radius-lg)',padding:16,maxWidth:520}}>

      <div style={{height:300,border:'1px solid var(--border-secondary)',borderRadius:'var(--radius-lg)',overflow:'hidden'}}>
        <AppLayout role="admin" username="王小明" activeKey={active} onNavigate={setActive} onLogout={()=>{}}>
          <h3 style={{marginBottom:8}}>時段設定</h3>
          <p style={{color:'var(--text-secondary)'}}>點格子切換時段開放 / 關閉。</p>
        </AppLayout>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
