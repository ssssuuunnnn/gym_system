<script type="text/babel">
const TWEAK_DEFAULTS={"range":"今日"};
const RANGE_KEY={'今日':'today','本週':'week','本月':'month','本年':'year'};
function App(){
const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
const [active,setActive]=React.useState('dash');
const {DashboardLayout,DashboardContent}=window.PulseFitUIKit;
return React.createElement(React.Fragment,null,
React.createElement(DashboardLayout,{active,onNav:setActive},React.createElement(DashboardContent,{range:RANGE_KEY[t.range]})),
React.createElement(TweaksPanel,null,
React.createElement(TweakSection,{label:'時間範圍'}),
React.createElement(TweakRadio,{label:'區間',value:t.range,options:['今日','本週','本月','本年'],onChange:v=>setTweak('range',v)})));
}
(function wait(){if(window.PulseFitUIKit&&window.PulseFitUIKit.DashboardContent&&window.TweaksPanel){ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));}else{setTimeout(wait,30);}})();
</script>
