<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ title }}</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f5f7; color: #14171c;
         font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 420px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { margin: 0; color: #4a4f57; line-height: 1.8; }
</style>
</head>
<body>
<main>
  <h1>{{ title }}</h1>
  <p>{{ text }}</p>
</main>
</body>
</html>
