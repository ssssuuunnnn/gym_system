services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # 由 docker/postgres/init-roles.sh 建立兩個帳號與資料庫（見 docs/adr/0001-multi-tenancy.md）
      DB_NAME: ${DB_NAME:-fitness_studio}
      DB_OWNER_USER: ${DB_OWNER_USER:-fitness_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-changeme_owner}
      DB_APP_USER: ${DB_APP_USER:-fitness_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-changeme_app}
      DB_PLATFORM_USER: ${DB_PLATFORM_USER:-fitness_platform}
      DB_PLATFORM_PASSWORD: ${DB_PLATFORM_PASSWORD:-changeme_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-fitness_studio}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # 應用程式：受 RLS 限制的帳號；migration／平台工具：資料表擁有者
      DATABASE_URL: postgresql+psycopg://${DB_APP_USER:-fitness_app}:${DB_APP_PASSWORD:-changeme_app}@postgres:5432/${DB_NAME:-fitness_studio}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${DB_OWNER_USER:-fitness_owner}:${DB_OWNER_PASSWORD:-changeme_owner}@postgres:5432/${DB_NAME:-fitness_studio}
      APP_DB_ROLE: ${DB_APP_USER:-fitness_app}
      # 平台管理後台（http://platform.<BASE_DOMAIN>）：只能管理健身房清單的帳號
      PLATFORM_DATABASE_URL: postgresql+psycopg://${DB_PLATFORM_USER:-fitness_platform}:${DB_PLATFORM_PASSWORD:-changeme_platform}@postgres:5432/${DB_NAME:-fitness_studio}
      PLATFORM_DB_ROLE: ${DB_PLATFORM_USER:-fitness_platform}
      # 啟動時建立平台管理員（可重複執行、不覆蓋密碼）；留空則不建立，可改用 python -m app.cli create-platform-admin
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      # 每家健身房一個子網域：<subdomain>.BASE_DOMAIN。本機可用 demo.localhost、alpha.localhost …
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      # 沒有子網域的網址（http://localhost）使用的健身房；啟動時自動開通。正式環境請留空
      DEFAULT_TENANT: ${DEFAULT_TENANT:-demo}
      DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-示範健身房}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      BACKEND_CORS_ORIGINS: '["http://localhost"]'
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MEDIA_DIR: /app/media
      # LINE 通知店家（docs/adr/0004-line-notifications.md）：平台共用一個 LINE 官方帳號（Messaging API）。
      # 三個都留空＝不發送；Webhook 設為 https://platform.<BASE_DOMAIN>/api/v1/line/webhook
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_BOT_BASIC_ID: ${LINE_BOT_BASIC_ID:-}
      LINE_BOT_NAME: ${LINE_BOT_NAME:-健身房小幫手}
      LINE_PLAN_MONTHLY_QUOTA: ${LINE_PLAN_MONTHLY_QUOTA:-3000}
      # 通知裡連結的網址開頭；本機沒有 https 時改成 http
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - coach_media:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  coach_media:
