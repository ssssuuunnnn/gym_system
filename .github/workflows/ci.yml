name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  alembic-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t backend-image ./backend

      - name: Check Alembic Single Head
        run: |
          docker run --rm backend-image python -m alembic heads | wc -l | grep -q "^1$"
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fitness_app:app_pw@localhost:5432/fitness_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://fitness_owner:owner_pw@localhost:5432/fitness_test
      TEST_PLATFORM_DATABASE_URL: postgresql+psycopg://fitness_platform:platform_pw@localhost:5432/fitness_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Create database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE fitness_owner LOGIN PASSWORD 'owner_pw' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE fitness_app LOGIN PASSWORD 'app_pw' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE fitness_platform LOGIN PASSWORD 'platform_pw' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE fitness_test OWNER fitness_owner;
          SQL
          psql -h localhost -U postgres -d fitness_test -v ON_ERROR_STOP=1 \
            -c "ALTER SCHEMA public OWNER TO fitness_owner" \
            -c "GRANT USAGE ON SCHEMA public TO fitness_app" \
            -c "GRANT USAGE ON SCHEMA public TO fitness_platform"

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q
