# 自動部署到 AWS Lightsail（見 deploy/lightsail/README.md「自動部署」）
#
# main 的 CI 全部通過後自動部署那個 commit（只部署 main 最新的，見 check job）；也可以在 Actions 頁手動執行（Run workflow）。
# 流程：用部署專用 IAM 使用者的金鑰（只能讀／改這台主機的防火牆）→ 暫時在 Lightsail 防火牆開 22 給這台 runner 的 IP
#       → 執行 deploy/lightsail/deploy.sh → 不論成敗都把防火牆還原 → 確認網站有回應。
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 同一時間只跑一個部署；後到的排隊，不取消正在跑的
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 只部署 main 目前最新的 commit：連續合併兩個 PR 時，兩次 CI 完成的先後不一定，
  # 較舊 commit 的部署可能比較晚跑而蓋掉新版（2026-11-03 #55／#56 就發生過）。
  # 不是最新的就跳過——最新那個 commit 的 CI 通過後會自己部署。
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.latest.outputs.deploy }}
      sha: ${{ steps.latest.outputs.sha }}
    steps:
      - id: latest
        name: 確認是 main 最新的 commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          echo "main 最新：$tip，這次要部署：$CANDIDATE"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手動執行一律部署 main 最新
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "sha=$tip" >> "$GITHUB_OUTPUT"
          elif [ "$tip" = "$CANDIDATE" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$CANDIDATE 不是 main 最新的 commit，跳過（交給最新 commit 的部署）"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://platform.bookdex.cc
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      LIGHTSAIL_INSTANCE: ${{ vars.LIGHTSAIL_INSTANCE || 'gym-system' }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'https://platform.bookdex.cc/robots.txt' }}
    steps:
      - name: 檢查設定
        env:
          AWS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$AWS_KEY_ID" ] || missing="$missing 密鑰 AWS_ACCESS_KEY_ID"
          [ -n "$AWS_KEY_SECRET" ] || missing="$missing 密鑰 AWS_SECRET_ACCESS_KEY"
          [ -n "$HOST" ] || missing="$missing 密鑰 DEPLOY_HOST"
          [ -n "$KEY" ] || missing="$missing 密鑰 DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::production 環境還沒設定：$missing（見 deploy/lightsail/README.md「自動部署」）"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # check job 確認過的 commit（main 最新）
          ref: ${{ needs.check.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # 這個 AWS 項目的受管 SCP 禁止 iam:*Provider*，無法用 GitHub OIDC，只能用 IAM 使用者金鑰
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 暫時開放 SSH 給這台 runner
        shell: bash
        run: |
          set -euo pipefail
          ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "runner IP：$ip"
          # 先存下目前的防火牆規則，結束時原樣還原
          aws lightsail get-instance-port-states --instance-name "$LIGHTSAIL_INSTANCE" \
            | jq '[.portStates[] | {fromPort, toPort, protocol, cidrs, ipv6Cidrs, cidrListAliases} | with_entries(select(.value != null))]' > "$RUNNER_TEMP/ports-original.json"
          # 22 已有規則就把 runner IP 加進去，沒有就新增一條
          jq --arg cidr "$ip/32" '
            if any(.[]; .fromPort == 22 and .toPort == 22 and .protocol == "tcp")
            then map(if .fromPort == 22 and .toPort == 22 and .protocol == "tcp" then .cidrs = ((.cidrs // []) + [$cidr] | unique) else . end)
            else . + [{fromPort: 22, toPort: 22, protocol: "tcp", cidrs: [$cidr]}]
            end' "$RUNNER_TEMP/ports-original.json" > "$RUNNER_TEMP/ports-deploy.json"
          aws lightsail put-instance-public-ports --instance-name "$LIGHTSAIL_INSTANCE" \
            --port-infos "file://$RUNNER_TEMP/ports-deploy.json" > /dev/null
          echo "PORTS_CHANGED=1" >> "$GITHUB_ENV"
          sleep 10 # 等防火牆生效

      - name: 準備 SSH 金鑰
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 有設定 DEPLOY_KNOWN_HOSTS 就驗證主機指紋；沒有的話 deploy.sh 會在第一次連線時接受（accept-new）
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts; fi

      - name: 部署
        env:
          GYM_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GYM_DEPLOY_KEY: /home/runner/.ssh/deploy_key
        run: sh deploy/lightsail/deploy.sh

      - name: 還原防火牆
        if: always() && env.PORTS_CHANGED == '1'
        run: |
          aws lightsail put-instance-public-ports --instance-name "$LIGHTSAIL_INSTANCE" \
            --port-infos "file://$RUNNER_TEMP/ports-original.json" > /dev/null
          echo "已還原 Lightsail 防火牆規則"

      - name: 確認網站有回應
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "$HEALTHCHECK_URL"; then echo "OK：$HEALTHCHECK_URL"; exit 0; fi
            sleep 6
          done
          echo "::error::部署後 2 分鐘內 $HEALTHCHECK_URL 沒有正常回應，請到主機看 docker compose logs"
          exit 1

      - name: 清除金鑰
        if: always()
        run: rm -f ~/.ssh/deploy_key
